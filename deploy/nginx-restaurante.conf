# Reverse proxy HTTPS para a app Gestão Restaurante
# Frontend (build estático) + /api -> backend uvicorn (127.0.0.1:8001)
# Instalado por scripts/setup_https.sh

server {
    listen 80;
    server_name _;
    # Redireciona tudo para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/restaurante/fullchain.pem;
    ssl_certificate_key /etc/ssl/restaurante/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # SPA (React build)
    root REPLACE_ROOT;
    index index.html;

    # API -> backend FastAPI/uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
