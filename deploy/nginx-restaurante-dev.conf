# Reverse proxy HTTPS — MODO DEV (mantém o `yarn start`)
# `/`     -> CRA dev server (127.0.0.1:3000) + WebSocket do hot-reload
# `/api/` -> backend uvicorn (127.0.0.1:8001)
# Substitui SEU_DOMINIO pelo teu domínio (ex: restaurante.exemplo.pt).
# Os caminhos dos certificados são preenchidos pelo certbot (Let's Encrypt).

server {
    listen 80;
    server_name SEU_DOMINIO;
    location /.well-known/acme-challenge/ { root /var/www/html; }   # validação Let's Encrypt (HTTP-01)
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name SEU_DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Frontend em dev (yarn start) + hot-reload (WebSocket)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
